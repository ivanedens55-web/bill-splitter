{% extends "base.html" %}
{% block title %}Edit Payment{% endblock %}
{% block content %}
<div class="auth-card">
  <h1>Edit Payment</h1>
  <form action="/bill/{{ bill.id }}/edit/{{ payment.id }}" method="post">
    <label>Name</label>
    <input type="text" name="name" value="{{ payment.name }}" required>
    <label>Amount ({{ bill.currency }})</label>
    <input type="number" name="amount" value="{{ payment.amount }}" min="0.01" step="0.01" required>
    <button type="submit" class="btn btn-primary btn-full">Save Changes</button>
  </form>
  <p class="auth-link"><a href="/bill/{{ bill.id }}">← Cancel</a></p>
</div>
{% endblock %}
